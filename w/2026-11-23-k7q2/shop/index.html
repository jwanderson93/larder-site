  <script>
  (function () {
    var key = "larder-shop-ticks";
    var saved = {};
    try { saved = JSON.parse(localStorage.getItem(key) || "{}"); } catch (e) { saved = {}; }
    var syncNode = document.getElementById("larder-sync");
    var syncClient = null;
    var status = document.createElement("p");
    status.id = "saved-note";
    status.className = "lede";
    status.setAttribute("aria-live", "polite");
    if (syncNode) document.querySelector("main").appendChild(status);
    function paintTicks() {
      if (!syncClient) return;
      document.querySelectorAll("[data-shop]").forEach(function (box) {
        var tick = box.getAttribute("data-tick");
        var remote = (syncClient.fields()["tick.shop." + tick] || {}).value;
        if (remote === true || remote === false) box.checked = remote;
      });
      status.textContent = syncClient.statusText();
      status.setAttribute("data-sync", syncClient.status());
    }
    if (syncNode && window.LarderSync) {
      var cfg = JSON.parse(syncNode.textContent);
      syncClient = window.LarderSync.createClient({
        baseUrl: cfg.base_url,
        householdKey: cfg.household_key,
        week: cfg.week,
        storage: localStorage,
        onUpdate: paintTicks
      });
      syncClient.start();
    }
    document.querySelectorAll("[data-shop]").forEach(function (box) {
      var name = box.getAttribute("data-shop");
      var tick = box.getAttribute("data-tick");
      box.checked = !!saved[name];
      if (syncClient && tick) {
        var remote = (syncClient.fields()["tick.shop." + tick] || {}).value;
        if (remote === true || remote === false) box.checked = remote;
      }
      box.addEventListener("change", function () {
        saved[name] = box.checked;
        localStorage.setItem(key, JSON.stringify(saved));
        if (syncClient && tick) {
          var problem = syncClient.setField("tick.shop." + tick, box.checked);
          status.textContent = problem || syncClient.statusText();
        }
      });
    });
    document.querySelectorAll("[data-missing]").forEach(function (button) {
      button.addEventListener("click", function () {
        var name = button.getAttribute("data-missing");
        var note = localStorage.getItem("larder-missing-lines") || "";
        if (note.indexOf(name) === -1) note = (note ? note + ", " : "") + name;
        localStorage.setItem("larder-missing-lines", note);
        button.textContent = "Noted";
        if (syncClient) {
          var problem = syncClient.setField("missing", note.replace(/\s+/g, " ").trim());
          status.textContent = problem || syncClient.statusText();
        }
      });
    });
  })();
  </script>
